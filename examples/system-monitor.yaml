# Local Linux system commands. Quit the interactive Top session with q.
rows: 3
columns: 3
terminal:
  font: Monospace
  font_size: 14
  line_spacing: 1.15
  foreground: [220, 235, 225]
  background: [12, 22, 18]
buttons:
  - label: Run Top
    command: /usr/bin/top
    arguments: -d 1
    foreground: [240, 255, 245]
    background: [35, 105, 75]
  - label: Uptime
    command: /usr/bin/uptime
    foreground: [230, 240, 255]
    background: [35, 65, 100]
  - label: Memory
    command: /usr/bin/free
    arguments: -h
    foreground: [240, 230, 255]
    background: [75, 50, 105]
  - label: Disk Space
    command: /usr/bin/df
    arguments: -h
    foreground: [255, 240, 215]
    background: [105, 70, 30]
  - label: Processes
    command: /usr/bin/ps
    arguments: -eo pid,comm,%cpu,%mem --sort=-%cpu
    background: [35, 65, 100]
  - label: VM Statistics
    command: /usr/bin/vmstat
    arguments: -s
    background: [75, 50, 105]
  - label: Kernel Info
    command: /usr/bin/uname
    arguments: -a
    background: [35, 65, 100]
  - label: Date and Time
    command: /usr/bin/date
    arguments: "'+%Y-%m-%d %H:%M:%S %Z'"
    background: [105, 70, 30]
  - label: Current Folder
    command: /usr/bin/ls
    arguments: -lah
    background: [35, 105, 75]
