# Local Linux system commands. Quit the interactive Top session with q.
display_name: System Monitor
rows: 3
columns: 3
terminal:
  font: Monospace
  font_size: 14
  line_spacing: 1.15
  fg_color: [220, 235, 225]
  bg_color: [12, 22, 18]
buttons:
  - label: Run Top
    command: /usr/bin/top
    arguments: -d 1
    fg_color: [240, 255, 245]
    bg_color: [35, 105, 75]
  - label: Uptime
    command: /usr/bin/uptime
    fg_color: [230, 240, 255]
    bg_color: [35, 65, 100]
  - label: Memory
    command: /usr/bin/free
    arguments: -h
    fg_color: [240, 230, 255]
    bg_color: [75, 50, 105]
  - label: Disk Space
    command: /usr/bin/df
    arguments: -h
    fg_color: [255, 240, 215]
    bg_color: [105, 70, 30]
  - label: Processes
    command: /usr/bin/ps
    arguments: -eo pid,comm,%cpu,%mem --sort=-%cpu
    bg_color: [35, 65, 100]
  - label: VM Statistics
    command: /usr/bin/vmstat
    arguments: -s
    bg_color: [75, 50, 105]
  - label: Kernel Info
    command: /usr/bin/uname
    arguments: -a
    bg_color: [35, 65, 100]
  - label: Date and Time
    command: /usr/bin/date
    arguments: "'+%Y-%m-%d %H:%M:%S %Z'"
    bg_color: [105, 70, 30]
  - label: Current Folder
    command: /usr/bin/ls
    arguments: -lah
    bg_color: [35, 105, 75]
